name: detran_rj_multas_guias-mcp
displayName: "DETRAN RJ: Multas (Guia de Recolhimento de Multas)"
description: >
  DETRAN RJ: Multas (Guia de Recolhimento de Multas), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/detran_rj_multas_guias-mcp
repository: https://github.com/mcp-dir/detran_rj_multas_guias-mcp

tags:
  - detran_rj_multas_guias
